# Ustawienia warstwy androidowej.
#
# Trzymane tutaj, a nie w katalogu wersji, bo są potrzebne w bloku `buildscript`
# oraz w skrypcie `shared/android.gradle.kts` — w obu miejscach akcesory katalogu
# wersji nie są dostępne. Warstwa androidowa jest opcjonalna: patrz komentarz
# w settings.gradle.kts.
agpVersion=8.13.0
androidCompileSdk=36
androidMinSdk=26
androidTargetSdk=36

# Wymagane, odkąd moduł aplikacji zależy od MapLibre — SDK mapy ciągnie androidx
# tranzytywnie (annotation, fragment, activity, core, lifecycle). Sami z androidx
# nie korzystamy bezpośrednio.
android.useAndroidX=true

org.gradle.caching=true
org.gradle.parallel=true

# Pamięć demona Gradle.
#
# Domyślne ustawienia (-Xmx512m, MaxMetaspaceSize=384m) nie wystarczają, gdy w jednym
# buildzie pracują naraz AGP, Kotlin Multiplatform i kompilator Kotlina — demon wywracał
# się na `OutOfMemoryError: Metaspace`. Metaspace jest tu wąskim gardłem, bo każdy plugin
# ładuje własny zestaw klas.
#
# Wartości mieszczą się w limitach runnera GitHub Actions (4 CPU, 16 GB RAM).
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2048m
