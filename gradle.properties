# Ustawienia warstwy androidowej.
#
# Trzymane tutaj, a nie w katalogu wersji, bo są potrzebne w bloku `buildscript`
# oraz w skrypcie `shared/android.gradle.kts` — w obu miejscach akcesory katalogu
# wersji nie są dostępne. Warstwa androidowa jest opcjonalna: patrz komentarz
# w settings.gradle.kts.
agpVersion=8.13.0
androidCompileSdk=36
androidMinSdk=26
androidTargetSdk=36

org.gradle.caching=true
org.gradle.parallel=true
