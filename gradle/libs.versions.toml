[versions]
brouter = "v1.7.10"
kotlin = "2.4.10"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines = "1.11.0"
jvmToolchain = "21"
maplibre = "13.4.1"

# Wersje warstwy androidowej (AGP, poziomy SDK) mieszkają w gradle.properties —
# są potrzebne tam, gdzie katalog wersji nie jest jeszcze dostępny.

[libraries]
brouter-core = { module = "com.github.abrensch.brouter:brouter-core", version.ref = "brouter" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
maplibre-android-sdk = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
# Plugin `org.jetbrains.kotlin.android` celowo nie ma tu wpisu — w module androidApp
# wskazujemy go bez wersji, bo jest już na classpath korzenia (patrz androidApp/build.gradle.kts).
