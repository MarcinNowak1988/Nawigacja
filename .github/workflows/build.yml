name: Build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Kompilacja i testy
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4
        with:
          # BRouter jest podmodulem (ADR-0009) — bez tego modul :brouter nie powstaje.
          submodules: true

      - name: Konfiguracja JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Konfiguracja Gradle
        uses: gradle/actions/setup-gradle@v4

      # Moduł `shared` deklaruje wyłącznie target `jvm`, więc build przechodzi
      # na zwykłym runnerze Linux — bez Android SDK i bez Xcode.
      - name: Kompilacja i testy
        run: ./gradlew build --no-daemon

      - name: Publikacja raportów z testów
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raporty-testow
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          retention-days: 14
          if-no-files-found: ignore
