name: APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: Typ builda
        type: choice
        default: release
        options: [release, debug]

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Budowa i publikacja APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Konfiguracja Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runner ubuntu-latest ma Android SDK preinstalowane, więc moduł :androidApp
      # dołącza się automatycznie (autodetekcja opisana w settings.gradle.kts).
      - name: Kontrola dostępności Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<brak>}"
          test -n "$ANDROID_HOME" || { echo "Brak Android SDK na runnerze"; exit 1; }

      # Klucz podpisujący jest opcjonalny. Bez skonfigurowanych sekretów APK zostaje
      # podpisany kluczem debugowym — jest instalowalny i nadaje się do testów, ale
      # NIE do dystrybucji w sklepie.
      - name: Przygotowanie klucza podpisującego
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Podpisywanie kluczem wydania."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Brak sekretu RELEASE_KEYSTORE_BASE64 - APK bedzie podpisany kluczem debugowym."
          fi

      - name: Budowa APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew :androidApp:assembleDebug --no-daemon
          else
            ./gradlew :androidApp:assembleRelease --no-daemon
          fi

      - name: Ustalenie ścieżki artefaktu
        id: apk
        run: |
          FILE=$(find androidApp/build/outputs/apk -name '*.apk' | head -n 1)
          test -n "$FILE" || { echo "Nie znaleziono APK"; exit 1; }
          # Nazwa gałęzi może zawierać ukośniki, które nie nadają się do nazwy pliku.
          VERSION="${GITHUB_REF_NAME//\//-}"
          TARGET="reactivebike-${VERSION}.apk"
          cp "$FILE" "$TARGET"
          echo "file=$TARGET" >> "$GITHUB_OUTPUT"
          ls -lh "$TARGET"

      - name: Publikacja APK jako artefaktu przebiegu
        uses: actions/upload-artifact@v4
        with:
          name: reactivebike-apk
          path: ${{ steps.apk.outputs.file }}
          retention-days: 30
          if-no-files-found: error

      - name: Utworzenie wydania GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            NOTE="APK podpisany kluczem wydania."
          else
            NOTE=":warning: APK podpisany **kluczem debugowym** - nadaje sie do testow, nie do dystrybucji. Skonfiguruj sekret \`RELEASE_KEYSTORE_BASE64\`, zeby podpisywac kluczem wydania."
          fi

          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.file }}" \
            --title "$GITHUB_REF_NAME" \
            --notes "$NOTE"
