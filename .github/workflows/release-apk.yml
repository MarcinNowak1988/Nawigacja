name: APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: Typ builda
        type: choice
        default: release
        options: [release, debug]
      release_tag:
        description: >-
          Tag wydania, np. v0.1.0. Pozostaw pusty, żeby dostać wyłącznie artefakt przebiegu.
          Podany tag zostanie utworzony po stronie GitHuba na budowanym commicie.
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Budowa i publikacja APK
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v4

      - name: Konfiguracja JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Konfiguracja Gradle
        uses: gradle/actions/setup-gradle@v4

      # Runner ubuntu-latest ma Android SDK preinstalowane, więc moduł :androidApp
      # dołącza się automatycznie (autodetekcja opisana w settings.gradle.kts).
      - name: Kontrola dostępności Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-<brak>}"
          test -n "$ANDROID_HOME" || { echo "Brak Android SDK na runnerze"; exit 1; }

      # Klucz podpisujący jest opcjonalny. Bez skonfigurowanych sekretów APK zostaje
      # podpisany kluczem debugowym — jest instalowalny i nadaje się do testów, ale
      # NIE do dystrybucji w sklepie.
      - name: Przygotowanie klucza podpisującego
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Podpisywanie kluczem wydania."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Brak sekretu RELEASE_KEYSTORE_BASE64 - APK bedzie podpisany kluczem debugowym."
          fi

      - name: Budowa APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ inputs.build_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew :androidApp:assembleDebug --no-daemon
          else
            ./gradlew :androidApp:assembleRelease --no-daemon
          fi

      # Build produkuje po jednym APK na architekturę plus wariant uniwersalny.
      # Wszystkie trafiają do wydania — pobierający wybiera swoją architekturę albo
      # bierze uniwersalny, jeśli nie wie.
      - name: Zebranie i nazwanie plików APK
        id: apk
        run: |
          # Przy wydaniu nazwa pochodzi z tagu, inaczej z refa. Nazwa gałęzi może zawierać
          # ukośniki, które nie nadają się do nazwy pliku.
          VERSION="${{ inputs.release_tag || github.ref_name }}"
          VERSION="${VERSION//\//-}"

          mkdir -p dist
          found=0
          while IFS= read -r file; do
            name=$(basename "$file")
            # Nazwy AGP to androidApp-<abi>-<buildType>.apk albo androidApp-<buildType>.apk
            abi=$(printf '%s' "$name" | sed -E 's/^androidApp-(.*)-(debug|release)\.apk$/\1/')
            if [ "$abi" = "$name" ]; then abi="universal"; fi
            cp "$file" "dist/reactivebike-${VERSION}-${abi}.apk"
            found=$((found + 1))
          done < <(find androidApp/build/outputs/apk -name '*.apk' | sort)

          test "$found" -gt 0 || { echo "Nie znaleziono zadnego APK"; exit 1; }
          echo "dir=dist" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Publikacja APK jako artefaktu przebiegu
        uses: actions/upload-artifact@v4
        with:
          name: reactivebike-apk
          path: ${{ steps.apk.outputs.dir }}
          retention-days: 30
          if-no-files-found: error

      # Wydanie powstaje przy pushu tagu `v*` albo gdy uruchamiając workflow ręcznie podano
      # `release_tag`. W tym drugim wypadku `gh release create` zakłada tag samodzielnie na
      # budowanym commicie (`--target`), więc nie trzeba go wcześniej pushować.
      - name: Utworzenie wydania GitHub
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            SIGNING="APK podpisany kluczem wydania."
          else
            SIGNING=":warning: APK podpisany **kluczem debugowym** - nadaje sie do testow, nie do dystrybucji w sklepie. Skonfiguruj sekret \`RELEASE_KEYSTORE_BASE64\`, zeby podpisywac kluczem wydania."
          fi

          GUIDE="**Ktory plik pobrac?** \`arm64-v8a\` pasuje do praktycznie kazdego telefonu z ostatnich lat i jest najmniejszy. Jesli nie masz pewnosci, wez \`universal\` - dziala wszedzie, ale wazy wiecej."
          NOTE="${SIGNING}"$'\n\n'"${GUIDE}"

          gh release create "$TAG" ${{ steps.apk.outputs.dir }}/*.apk \
            --title "$TAG" \
            --target "$GITHUB_SHA" \
            --notes "$NOTE"
